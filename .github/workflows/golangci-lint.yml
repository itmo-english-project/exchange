name: golangci-lint
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Configure Git for SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/itmo-english-project/*
          go env -w GONOSUMDB=github.com/itmo-english-project/*
      - name: Verify SSH access
        run: ssh -T git@github.com || true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6
          args: --timeout=5m
          only-new-issues: true
  test:
    name: test
    runs-on: ubuntu-latest
    needs: golangci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: go.sum
      - name: Git config
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - name: Configure GOPRIVATE
        run: |
          go env -w GOPRIVATE=github.com/itmo-english-project/*
          go env -w GONOSUMDB=github.com/itmo-english-project/*
      - name: Get dependencies
        run: go mod download
      - name: Run tests
        run: go test -v -race -cover ./...
      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Display coverage
        run: go tool cover -func=coverage.out